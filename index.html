<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    form { background: #fff; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    input, textarea { width: 100%; padding: 10px; margin-top: 10px; }
    button { margin-top: 10px; padding: 10px; background: #007BFF; color: white; border: none; width: 100%; }
  </style>
</head>
<body>
  <h2>Contact Me</h2>
  <form id="contactForm">
    <input type="text" placeholder="Your Name" id="name" required>
    <input type="email" placeholder="Your Email" id="email" required>
    <textarea placeholder="Your Message" id="message" required></textarea>
    <button type="submit">Send</button>
  </form>

  <script type="module" src="contact.js"></script>
</body>
</html>
